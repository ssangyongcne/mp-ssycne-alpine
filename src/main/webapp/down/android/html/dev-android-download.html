<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no"/>
    <link rel="stylesheet" href="../css/morpheus-style.css" />

    <title>쌍용씨앤이 안드로이드 다운로드 화면</title>
</head>
<body>
    <div class="wrapper">
        <div class="install">
            <div class="top-header">
                <h1 class="logo">Ssangyong C&amp;E</h1> 
                <p class="download">쌍용씨앤이의 산우회 모바일플랫폼을 다운로드합니다.</p>
                <p class="download-install">Android 설치방법</p>
            </div>
            <div class="content">
                <div class="install-order">
                    <div class="list">
                        <ul>
                            <li class="txt">하단의 App 다운로드 버튼을 터치하여 APK 파일을 다운받습니다.</li>
                            <li class="txt">휴대폰의 다운로드 폴더로 이동하여 다운로드 된 APK 파일을 실행합니다.</li>
                            <li class="txt">설치 버튼을 터치합니다.</li>
                            <li class="img"><img src="../img/img_install_01.png" alt=""></li>
                            <li class="txt">무시하고 설치 버튼을 터치합니다.</li>
                            <li class="img"><img src="../img/img_install_02.png" alt=""></li>
                            <li class="txt">무시하고 설치 버튼을 터치합니다.</li>
                            <li class="img"><img src="../img/img_install_03.png" alt=""></li>
                            <li class="txt">설치가 완료되어 열기 버튼을 터치하면 쌍용 C&E 산우회 APP으로 이동합니다.</li>
                            <li class="img"><img src="../img/img_install_04.png" alt=""></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="app-download"><button type="button" onclick="downApk();"><span>App 다운로드</span></button></div>
        </div>
    </div>
</body>
</html>

<script type="text/javascript">

	function downApk(){
		downPage =location.origin + "/uploadfiles/apk/protest/kr.co.ssycne.mobile.apk";
		location.href = downPage;
	}
</script>
